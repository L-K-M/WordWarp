name: GLM 5.2 PR Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: zai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR with GLM 5.2
    runs-on: ubuntu-latest
    # Long enough for the action to exhaust its own retry budget and report.
    #
    # The action gives each request 300s and retries a chunk three times, so an
    # unresponsive upstream costs 15 minutes per chunk; MAX_DIFF_CHARS below
    # allows two or three chunks, which is 30-45 minutes of pure waiting. At the
    # previous ceiling of 30 the runner killed the job mid-retry, which is worse
    # than a slow failure: the review comment is written only after the last
    # chunk settles, so a cancellation discards the findings of every chunk that
    # did succeed and posts nothing at all. Leaving room for the retries to run
    # out turns that silent cancellation into the action's own "review
    # incomplete" notice, naming the chunks that failed.
    timeout-minutes: 50
    # pull_request_target exposes repository secrets and a write-capable token.
    # Never run this privileged job for branches from untrusted forks, and never
    # check out or execute pull-request code in this workflow.
    if: >-
      ${{ github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - name: Z.ai Code Review
        if: ${{ env.ZAI_API_KEY != '' }}
        uses: L-K-M/zai-code-review@8e718ac45f13c5ae0e57b19a00afd54d42e5b8f7
        with:
          ZAI_API_KEY: ${{ env.ZAI_API_KEY }}
          ZAI_MODEL: glm-5.2
          ZAI_REVIEWER_NAME: GLM 5.2 Code Review
          EXCLUDE_PATTERNS: "*.lock,package-lock.json,dist/**,playwright-report/**,test-results/**"
          MAX_DIFF_CHARS: "120000"
          GITHUB_TOKEN: ${{ github.token }}

      - name: Skip when Z.ai API key is unavailable
        if: ${{ env.ZAI_API_KEY == '' }}
        run: echo "Skipping Z.ai review because ZAI_API_KEY is not configured."
