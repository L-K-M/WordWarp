name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  container:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait --wait-timeout 90
      - name: Verify container responses
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/nested/path | grep --quiet 'src="/assets/'
          test "$(curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}' http://127.0.0.1:8080/manifest.webmanifest)" = "application/manifest+json"
          curl --fail --silent --show-error --head http://127.0.0.1:8080/sw.js | tr --delete '\r' | grep --ignore-case --quiet '^Cache-Control:.*no-cache'
      - if: always()
        run: docker compose down --volumes
