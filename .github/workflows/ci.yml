name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Preserve a result for every main/tag commit; only superseded PR runs are disposable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      - name: Validate shell entry points
        run: bash -n scripts/*.sh update.sh

      # Diagnostic only -- nothing downloads this, and Pages builds its own artifact. Kept
      # non-fatal so a full artifact store cannot turn a passing gate red: that failure is
      # indistinguishable from a real one in the checks list, and it hid a broken WebKit test
      # for weeks. `if-no-files-found: error` still fails the step when the build produced
      # nothing, which is a genuine signal; continue-on-error only stops it failing the job.
      # The release workflow's upload is a real dependency and is deliberately left strict.
      - name: Upload production build
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordwarp-site-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser and PWA tests (${{ matrix.deployment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment: pages
            base-path: /WordWarp/
          - deployment: portable
            base-path: ./
    env:
      VITE_BASE_PATH: ${{ matrix.base-path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Run Pages browser tests
        if: matrix.deployment == 'pages'
        run: npm run test:e2e

      - name: Run portable archive browser tests
        if: matrix.deployment == 'portable'
        run: npm run test:e2e -- --project=chromium

      - name: Run native canvas bridge tests
        if: matrix.deployment == 'pages'
        run: npm run test:native

      # Both uploads below are evidence for a human reading a failure, never an input to another
      # job, so they are non-fatal for the same reason as the build upload above. Losing the
      # report is a worse day; losing the test result it describes is a worse repository.
      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.deployment }}-${{ github.sha }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright failure evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ matrix.deployment }}-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  native-macos:
    name: macOS app (${{ matrix.arch }}, ad-hoc signed)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      WORDWARP_MACOS_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies and build native app
        run: |
          npm ci
          bash scripts/build-macos.sh

      - name: Verify architecture, signature, and actual WKWebView editor
        run: |
          set -euo pipefail
          APP=native/macos/build/WordWarp.app
          lipo "$APP/Contents/MacOS/WordWarp" -verify_arch "$WORDWARP_MACOS_ARCH"
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/WordWarp" \
            --self-test "$RUNNER_TEMP/wordwarp-macos.png" \
            --self-test-import "$GITHUB_WORKSPACE/tests/fixtures/android-roundtrip.wordwarp.json"
          test -s "$RUNNER_TEMP/wordwarp-macos.png"

      - name: Checksum verified app archive
        working-directory: artifacts/native
        run: shasum -a 256 "WordWarp-macOS-$WORDWARP_MACOS_ARCH.zip" > "WordWarp-macOS-$WORDWARP_MACOS_ARCH.zip.sha256"

      # Native build downloads are deliverables; uploads are intentionally strict.
      - name: Upload verified macOS app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordwarp-native-macos-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/native/WordWarp-macOS-${{ matrix.arch }}.zip
            artifacts/native/WordWarp-macOS-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload native self-test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-self-test-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wordwarp-macos.png*
          if-no-files-found: ignore
          retention-days: 7

  native-android:
    name: Android debug APK and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            native/android/**/*.gradle.kts
            native/android/gradle/wrapper/gradle-wrapper.properties

      - name: Ensure required Android SDK packages
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;35.0.0'"

      - name: Install locked dependencies, build APK, and lint
        run: |
          npm ci
          bash scripts/build-android.sh :app:lintDebug :app:assembleDebugAndroidTest

      - name: Verify debug APK and checksum
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/native/WordWarp-android-debug.apk
          cd artifacts/native
          sha256sum WordWarp-android-debug.apk > WordWarp-android-debug.apk.sha256

      - name: Upload verified Android debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordwarp-native-android-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/native/WordWarp-android-debug.apk
            artifacts/native/WordWarp-android-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-${{ github.sha }}-${{ github.run_attempt }}
          path: native/android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

  native-linux:
    name: Ubuntu package and native WebKitGTK editor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install native Ubuntu runtime and test display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 \
            xvfb xauth dbus-x11 fonts-dejavu-core desktop-file-utils

      - name: Build and install Debian package
        run: |
          set -euo pipefail
          npm ci
          npm run build:native
          bash scripts/build-linux.sh --skip-web
          test "$(dpkg-deb --field artifacts/native/WordWarp-linux-all.deb Architecture)" = all
          sudo apt-get install -y ./artifacts/native/WordWarp-linux-all.deb

      - name: Exercise installed editor under WebKitGTK
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          # WebKitGTK's subprocess sandbox uses bwrap; Ubuntu 24.04 AppArmor
          # denies unprivileged user namespaces unless this knob is off.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python3 native/linux/test_recovery.py
          timeout 180 dbus-run-session -- xvfb-run -a \
            /usr/bin/wordwarp --self-test "$RUNNER_TEMP/wordwarp-linux.png"
          test -s "$RUNNER_TEMP/wordwarp-linux.png"

      - name: Checksum verified Debian package
        working-directory: artifacts/native
        run: sha256sum WordWarp-linux-all.deb > WordWarp-linux-all.deb.sha256

      - name: Upload verified Ubuntu package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordwarp-native-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/native/WordWarp-linux-all.deb
            artifacts/native/WordWarp-linux-all.deb.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload native self-test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-self-test-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wordwarp-linux.png*
          if-no-files-found: ignore
          retention-days: 7

  native-flatpak:
    name: Linux Flatpak bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Ubuntu 24.04 denies the unprivileged user namespaces bubblewrap
      # (flatpak's sandbox helper) builds in.
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak flatpak-builder elfutils librsvg2-bin
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true   # absent on kernels without the knob

      - name: Build Flatpak bundle
        run: |
          npm ci
          bash scripts/build-flatpak.sh

      - name: Checksum Flatpak bundle
        working-directory: artifacts/native
        run: sha256sum WordWarp-linux.flatpak > WordWarp-linux.flatpak.sha256

      - name: Upload verified Flatpak bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordwarp-native-flatpak-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/native/WordWarp-linux.flatpak
            artifacts/native/WordWarp-linux.flatpak.sha256
          if-no-files-found: error
          retention-days: 14

  container:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start production container
        run: docker compose up --build --detach --wait --wait-timeout 90

      - name: Verify container responses
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/nested/path | grep --quiet 'src="/assets/'
          test "$(curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}' http://127.0.0.1:8080/manifest.webmanifest)" = "application/manifest+json"
          curl --fail --silent --show-error --head http://127.0.0.1:8080/sw.js | tr --delete '\r' | grep --ignore-case --quiet '^Cache-Control:.*no-cache'

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs

      - name: Stop production container
        if: always()
        run: docker compose down --volumes
