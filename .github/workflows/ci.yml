name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Preserve a result for every main/tag commit; only superseded PR runs are disposable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      - name: Validate shell entry points
        run: bash -n scripts/*.sh update.sh

      # Diagnostic only -- nothing downloads this, and Pages builds its own artifact. Kept
      # non-fatal so a full artifact store cannot turn a passing gate red: that failure is
      # indistinguishable from a real one in the checks list, and it hid a broken WebKit test
      # for weeks. `if-no-files-found: error` still fails the step when the build produced
      # nothing, which is a genuine signal; continue-on-error only stops it failing the job.
      # The release workflow's upload is a real dependency and is deliberately left strict.
      - name: Upload production build
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordwarp-site-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser and PWA tests (${{ matrix.deployment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment: pages
            base-path: /WordWarp/
          - deployment: portable
            base-path: ./
    env:
      VITE_BASE_PATH: ${{ matrix.base-path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Run Pages browser tests
        if: matrix.deployment == 'pages'
        run: npm run test:e2e

      - name: Run portable archive browser tests
        if: matrix.deployment == 'portable'
        run: npm run test:e2e -- --project=chromium

      # Both uploads below are evidence for a human reading a failure, never an input to another
      # job, so they are non-fatal for the same reason as the build upload above. Losing the
      # report is a worse day; losing the test result it describes is a worse repository.
      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.deployment }}-${{ github.sha }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright failure evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ matrix.deployment }}-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start production container
        run: docker compose up --build --detach --wait --wait-timeout 90

      - name: Verify container responses
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/nested/path | grep --quiet 'src="/assets/'
          test "$(curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}' http://127.0.0.1:8080/manifest.webmanifest)" = "application/manifest+json"
          curl --fail --silent --show-error --head http://127.0.0.1:8080/sw.js | tr --delete '\r' | grep --ignore-case --quiet '^Cache-Control:.*no-cache'

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs

      - name: Stop production container
        if: always()
        run: docker compose down --volumes
