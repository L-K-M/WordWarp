name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Match tag, package, lockfile, and main history
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          if [[ "$TAG" != v* || ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::Release tag must use vX.Y.Z or vX.Y.Z-pre form."
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          LOCK_ROOT_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package-lock.json', 'utf8')).version")"
          LOCK_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package-lock.json', 'utf8')).packages[''].version")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" || "$VERSION" != "$LOCK_ROOT_VERSION" || "$VERSION" != "$LOCK_VERSION" ]]; then
            echo "::error::Tag $TAG must match package.json and package-lock.json."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

  ci:
    name: Re-prove tagged source
    needs: verify-version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Package static site
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Keep release archives portable across HTTPS static hosts.
      VITE_BASE_PATH: ./
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build portable static site
        run: npm run build

      - name: Package and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          tar -czf "release-artifacts/wordwarp-${TAG}.tar.gz" -C dist .
          (
            cd release-artifacts
            sha256sum "wordwarp-${TAG}.tar.gz" > "wordwarp-${TAG}.tar.gz.sha256"
          )

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordwarp-release-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wordwarp-release-${{ github.sha }}
          path: release-artifacts/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/l-k-m/wordwarp
          tags: |
            type=semver,pattern={{version}}

      - name: Build and publish container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: WordWarp ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.sha256
